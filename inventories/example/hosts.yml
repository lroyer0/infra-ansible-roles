---
# Example inventory. Addresses come from the documentation ranges (RFC 5737, RFC 6598): replace them with your own.
all:
  vars:
    ansible_user: deploy
    hardening_deploy_authorized_keys:
      - "ssh-ed25519 AAAA...replace-me deploy@controller"
  children:
    tier1:
      hosts:
        edge-1:
          ansible_host: 100.64.0.11
          base_reboot_time: "04:00"
          tailscale_tag: "tag:edge"
        edge-2:
          ansible_host: 100.64.0.12
          base_reboot_time: "05:00"   # two tier 1 nodes never reboot in the same window
          tailscale_tag: "tag:edge"
    home:
      hosts:
        media-1:
          ansible_host: 192.0.2.21
          base_qemu_guest_agent: true
          tailscale_enabled: false    # the home network is joined by one subnet router
          unbound_enabled: false
          hardening_ssh_sources: ["192.0.2.0/24"]
    cloudflared_hosts:
      hosts:
        edge-1:
        edge-2:
    caddy_hosts:
      hosts:
        edge-1:
        edge-2:
    backup_clients:
      hosts:
        edge-1:
    monitor_only:
      hosts: {}
    proxmox:
      hosts: {}
