---
- name: Recharger sshd
  # restarted et non reloaded : le rechargement SIGHUP échoue en LXC non privilégié ("Cannot bind any address"), les sessions ouvertes survivent
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
- name: Recharger nftables
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true
- name: Recharger sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
